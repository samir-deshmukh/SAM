name: Backend tests

on:
  push:
    branches: [main, security-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cet/requirements-dev.txt
      - name: Install dependencies
        working-directory: cet
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite
        working-directory: cet
        run: python -m pytest -o addopts='' -q
