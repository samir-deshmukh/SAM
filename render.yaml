services:
  - type: web
    name: cet-find-web
    runtime: docker
    plan: free
    region: singapore
    rootDir: cet
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: CET_PDF_STORAGE_BACKEND
        value: local
      - key: CET_ADMIN_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cet-find-db
          property: connectionString

databases:
  - name: cet-find-db
    databaseName: cet_find_db
    user: cet_find_db_user
    plan: free
    region: singapore
    postgresMajorVersion: 16
