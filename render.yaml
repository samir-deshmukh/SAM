services:
  - type: web
    name: cet-find-web
    runtime: python
    plan: free
    region: singapore
    rootDir: cet
    buildCommand: apt-get update && apt-get install -y tesseract-ocr && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CET_PDF_STORAGE_BACKEND
        value: local
      - key: CET_ADMIN_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cet-find-db
          property: connectionString

databases:
  - name: cet-find-db
    databaseName: cet_find_db
    user: cet_find_db_user
    plan: free
    region: singapore
    postgresMajorVersion: 16
