<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CETFind — Guided Code Tour</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--panel:#fff;--ink:#20242a;--muted:#68717d;--line:#dce1e7;--blue:#244d83;--bluebg:#eaf1fb;--code:#111827}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}header{padding:20px 24px;background:white;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:var(--muted)}main{max-width:1500px;margin:auto;padding:14px;display:grid;grid-template-columns:250px minmax(280px,1fr) minmax(310px,40%);gap:12px;min-height:calc(100vh - 95px)}.panel{background:white;border:1px solid var(--line);border-radius:12px;min-width:0;overflow:hidden;display:flex;flex-direction:column}.panel h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0;padding:13px;border-bottom:1px solid var(--line);color:var(--muted)}#steps,#flow,#detail{padding:12px;overflow:auto}.step,.node,.controls button{font:inherit;background:white;border:1px solid var(--line);border-radius:9px;padding:10px;cursor:pointer;color:var(--ink)}.step{width:100%;text-align:left;margin-bottom:6px}.step small{display:block;color:var(--muted);font-size:12px}.step.active,.node.active{background:var(--bluebg);border-color:var(--blue)}.node{width:100%;text-align:left;display:block;padding:13px}.node strong,.node span{display:block}.node span{font-size:13px;color:var(--muted);margin-top:4px}.arrow{text-align:center;color:#8b949e;padding:5px}.intro,.explain,.branch{padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}.tag{font-size:11px;display:inline-block;padding:3px 7px;background:#eef0f4;border-radius:5px;margin:0 4px 7px 0}.tag.warn{background:#fff1d9;color:#80540d}h3{font-size:18px;margin:5px 0 8px}h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--code);color:#e5e7eb;padding:12px;border-radius:8px;font:12px/1.55 ui-monospace,monospace}p{margin:7px 0}.muted{color:var(--muted);font-size:13px}.branch b{display:block}.yes{border-left:4px solid #39815b}.no{border-left:4px solid #b58a37}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.controls button:disabled{opacity:.4}.source-link{font-size:13px;overflow-wrap:anywhere}
@media(max-width:1000px){main{grid-template-columns:220px minmax(0,1fr)}#detailPanel{grid-column:1/-1;min-height:400px}}@media(max-width:650px){main{display:flex;flex-direction:column}#stepsPanel{min-height:220px}#flowPanel{min-height:350px}#detailPanel{min-height:420px}}
</style></head><body>
<header><h1>CETFind code tour: Search Colleges</h1><p>Start here if you do not yet understand the trace files. Click a step to see the code pattern, what it means, and how the execution path can change.</p></header>
<main><section class="panel" id="stepsPanel"><h2>1 · Follow the steps</h2><div id="steps"></div></section><section class="panel" id="flowPanel"><h2>2 · Execution path</h2><div id="flow"></div></section><section class="panel" id="detailPanel"><h2>3 · Explain this step</h2><div id="detail"></div></section></main>
<script>
const steps=[
{id:'browser',title:'Browser collects search values',area:'site/index.html',file:'cet/site/index.html',summary:'Course, percentile, city, and sort are turned into URL query parameters.',why:'The browser keeps the current filter values in JavaScript. URLSearchParams encodes them so they can be sent in a GET request.',code:'const params = new URLSearchParams({\n  course,\n  percentile: String(currentPct),\n  city,\n  sort: currentSort === "rank" ? "rank" : "comp",\n  page: "1",\n  page_size: "50"\n});',note:'This prepares the request. It does not query the database yet.',branches:[['Values are prepared','Continue to the debounce and fetch logic.'],['A field is missing or invalid','Frontend guards or backend validation may reject the search.']],next:'debounce'},
{id:'debounce',title:'Wait and cancel stale requests',area:'site/index.html',file:'cet/site/index.html',summary:'The browser waits 180 ms, aborts the previous request if needed, and starts a new request sequence.',why:'This reduces repeated requests while the user is typing and prevents an older response from overwriting a newer one.',code:'searchTimer = setTimeout(async () => {\n  const seq = ++searchSequence;\n  if (searchRequest) searchRequest.abort();\n  searchRequest = new AbortController();\n  // fetch follows\n}, 180);',note:'A debounce is a short wait after input changes. AbortController requests cancellation of the previous network call.',branches:[['Previous request is running','Ask the browser to abort it.'],['Old response arrives late','The sequence check later ignores it.']],next:'fetch'},
{id:'fetch',title:'Send GET /api/search',area:'Browser → FastAPI',file:'cet/site/index.html',summary:'fetch() sends the query string and asks the server for JSON.',why:'This is the boundary between frontend JavaScript and Python backend code. The browser does not execute SQL.',code:'const response = await fetch(\x60${API_BASE}/api/search?\x60 + params.toString(), {\n  headers: { "Accept": "application/json" },\n  signal: searchRequest.signal\n});\nif (!response.ok) throw new Error("Search API failed: " + response.status);\nconst payload = await response.json();',note:'A non-success HTTP response goes to the frontend error handler instead of being treated as results.',branches:[['HTTP success','Parse JSON and render the results.'],['HTTP error','The catch path clears results and renders the empty/error state.'],['Request was aborted','The catch path treats AbortError as cancellation.']],next:'route'},
{id:'route',title:'FastAPI validates query parameters',area:'backend/api.py',file:'cet/backend/api.py',summary:'FastAPI checks required values and bounds before the route body runs.',why:'Percentile must be 0–100, page at least 1, page_size 1–50, and sort one of comp/alpha/city/rank.',code:'@router.get("/search", response_model=SearchResponse)\ndef search_colleges(\n    request: Request,\n    course: str = Query(...),\n    percentile: float = Query(..., ge=0.0, le=100.0),\n    city: Optional[str] = Query(None),\n    sort: str = Query("comp", pattern="^(comp|alpha|city|rank)$"),\n    page: int = Query(1, ge=1),\n    page_size: int = Query(25, ge=1, le=50),\n):',note:'Query(...) means required; Query(None) means optional. ge/le define inclusive limits.',branches:[['Inputs valid','Run the route function.'],['A declared constraint fails','FastAPI rejects the request before the handler body, normally with HTTP 422.']],next:'rate'},
{id:'rate',title:'Check the request rate limit',area:'backend/api.py',file:'cet/backend/api.py',summary:'check_rate_limit(request) runs before the search cache lookup.',why:'The project tracks recent timestamps by client IP to limit excessive requests. The configured threshold is 60 requests in 60 seconds.',code:'check_rate_limit(request)\nkey = ("search", course, percentile, (city or "").strip().lower(), sort, page, page_size)',note:'The cache key includes each input that affects the response. City is normalized to avoid duplicate keys for different casing or whitespace.',branches:[['Under the rate limit','Continue to cache lookup.'],['Limit exceeded','HTTP 429 stops the search path.']],next:'cache'},
{id:'cache',title:'Look up the cached response',area:'backend/api.py',file:'cet/backend/api.py',summary:'The handler asks _PUBLIC_CACHE for this exact search key, using a 60-second TTL.',why:'A fresh cache hit can return a previously computed SearchResponse without querying PostgreSQL again.',code:'return _PUBLIC_CACHE.get_or_set(\n    key, _SEARCH_TTL,\n    lambda: _search_colleges_uncached(\n        course, percentile, city, sort, page, page_size\n    ),\n)',note:'The lambda delays the uncached call. It runs only when the key has no fresh cached value. Exceptions are not cached.',branches:[['Fresh cache hit','Return the cached result; database query path is skipped.'],['Cache miss or expiry','Call _search_colleges_uncached and cache its successful result.']],next:'engine'},
{id:'engine',title:'Get the PostgreSQL engine',area:'backend/api.py',file:'cet/backend/api.py',summary:'On a cache miss, the uncached handler obtains the shared SQLAlchemy engine.',why:'The engine manages database connections. If it cannot be created, the code returns a service-unavailable response.',code:'try:\n    engine = get_active_engine()\nexcept Exception:\n    raise HTTPException(\n        status_code=503,\n        detail="Public PostgreSQL data service is unavailable."\n    )',note:'HTTP 503 means the data service is unavailable; it is not the same as a successful search with zero results.',branches:[['Engine available','Validate the requested course.'],['Engine creation raises','Return HTTP 503 and stop.']],next:'course'},
{id:'course',title:'Check the course against live data',area:'backend/api.py',file:'cet/backend/api.py',summary:'The backend loads available course families and rejects a course that is not present.',why:'The database is authoritative for available courses; the backend should not assume every course exists in the current dataset.',code:'valid_courses = available_public_courses(engine)\nif course not in valid_courses:\n    raise HTTPException(\n        status_code=400,\n        detail=f"Invalid course \'{course}\'. Must be one of: {valid_courses}",\n    )',note:'This branch stops before the main college search query.',branches:[['Course exists','Proceed to the paginated query.'],['Course absent','Return HTTP 400.']],next:'query'},
{id:'query',title:'Query and paginate college rows',area:'src/cet_cap/queries.py',file:'cet/src/cet_cap/queries.py',summary:'search_college_summary_page receives all search filters and pagination values.',why:'The design is to aggregate, sort, and paginate in PostgreSQL so only one page reaches pandas.',code:'paged_df, total_count = search_college_summary_page(\n    engine, percentage=percentile,\n    program_family=course, city=city, sort=sort,\n    page=page, page_size=page_size,\n)',note:'paged_df contains the current page; total_count describes the total number of matching rows across pages. The SQL implementation lives in this file.',branches:[['No rows on this page','Return an empty results list with pagination metadata.'],['Rows returned','Fetch metadata for these institution codes and build cards.'],['Database error','The request fails; do not mistake this for an empty result.']],next:'empty'},
{id:'empty',title:'Choose empty-result or card-building path',area:'backend/api.py',file:'cet/backend/api.py',summary:'The handler checks paged_df.empty after the main query.',why:'If the page has no rows, metadata work is unnecessary and the function returns early.',code:'if paged_df.empty:\n    return SearchResponse(\n        total=total_count, page=page,\n        page_size=page_size, results=[]\n    )',note:'No matching rows is a valid result. It differs from validation, rate-limit, or database errors.',branches:[['paged_df.empty is true','Return immediately; skip metadata and card construction.'],['paged_df.empty is false','Extract institution codes and fetch metadata.']],next:'metadata'},
{id:'metadata',title:'Fetch metadata for this page only',area:'backend/api.py',file:'cet/backend/api.py',summary:'The handler extracts institution codes and calls _search_metadata for those codes.',why:'This bounds extra work to the requested page rather than fetching metadata for every college.',code:'paged_codes = [str(v) for v in paged_df["institution_code"].tolist()]\ndrawer_meta, legacy_meta, seat_meta = _search_metadata(\n    engine, course, paged_codes\n)',note:'_search_metadata may reuse cached metadata; otherwise it issues a parameterized query for missing codes.',branches:[['All codes already cached','Reuse metadata.'],['Some codes missing','Query those codes and update the cache.']],next:'status'},
{id:'status',title:'Calculate safe / borderline / reach',area:'backend/api.py',file:'cet/backend/api.py',summary:'Each college’s highest cutoff is compared with the candidate percentile.',why:'These labels are heuristics based on the stored cutoff and a 2-point margin. They are not admission guarantees.',code:'cutoff_val = float(row["highest_cutoff"])\nif percentile >= cutoff_val + 2.0:\n    status_label = "safe"\nelif percentile >= cutoff_val:\n    status_label = "borderline"\nelse:\n    status_label = "reach"',note:'At least 2 points above cutoff → safe; at/above but less than 2 points above → borderline; below cutoff → reach.',branches:[['percentile ≥ cutoff + 2','safe'],['cutoff ≤ percentile < cutoff + 2','borderline'],['percentile < cutoff','reach']],next:'response'},
{id:'response',title:'Build the response and render it',area:'Backend → Browser',file:'cet/backend/api.py',summary:'The backend builds CollegeCard objects inside SearchResponse; the browser parses JSON and calls renderResultsTable().',why:'The API returns structured data, not a pre-built page. The frontend turns the JSON result objects into visible rows.',code:'results.append(CollegeCard(\n    id=f"{row[\'institution_code\']}_{course}",\n    institution_code=str(row["institution_code"]),\n    name=str(row["institution_name"]),\n    course=course,\n    highest_cutoff=round(cutoff_val, 2),\n    status=status_label,\n    # more fields are populated here\n))\n\n// Browser side:\nif (seq !== searchSequence) return;\nCONFIG.colleges = Array.isArray(payload.results) ? payload.results : [];\nrenderResultsTable();',note:'The sequence check ignores stale responses. The response model enforces a consistent JSON structure.',branches:[['Latest request succeeds','Store results and render the table.'],['Old response arrives','Ignore it.'],['Request fails','Clear the list and render the empty/error state.']],next:null}
];
let active='browser';const byId=Object.fromEntries(steps.map(s=>[s.id,s]));
function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function render(){const list=document.getElementById('steps');list.replaceChildren();steps.forEach((s,i)=>{const b=node('button','step'+(s.id===active?' active':''));b.onclick=()=>{active=s.id;render()};b.append(node('strong','',String(i+1)+'. '+s.title),node('small','',s.area));list.append(b)});
const flow=document.getElementById('flow');flow.replaceChildren();const intro=node('div','intro');intro.append(node('strong','','Important: source-guided path, not a live request trace.'));intro.append(node('p','muted','The normal path is shown here. A real request can branch at cache, validation, rate-limit, or database steps. The existing runtime tracer captures Python events only; it does not yet trace browser JavaScript or SQL internals.'));flow.append(intro);steps.forEach((s,i)=>{const b=node('button','node'+(s.id===active?' active':''));b.onclick=()=>{active=s.id;render()};b.append(node('strong','',s.title),node('span','',s.summary));flow.append(b);if(i<steps.length-1)flow.append(node('div','arrow','↓'))});
const s=byId[active],d=document.getElementById('detail');d.replaceChildren();d.append(node('h3','',s.title),node('span','tag',s.area),node('span','tag warn','Source-guided'),node('p','',s.summary),node('h4','','What is happening?'),node('p','',s.why),node('h4','','Code pattern'),node('pre','',s.code),node('p','muted',s.note),node('h4','','What changes the path?'));s.branches.forEach((br,i)=>{const box=node('div','branch '+(i===0?'yes':'no'));box.append(node('b','',br[0]),node('p','',br[1]));d.append(box)});d.append(node('h4','','Open source file'));const a=node('a','source-link',s.file+' on GitHub');a.href='https://github.com/samir-deshmukh/SAM/blob/main/'+s.file;a.target='_blank';a.rel='noopener noreferrer';d.append(a);const controls=node('div','controls');const i=steps.findIndex(x=>x.id===active),prev=node('button','','← Previous'),next=node('button','',i===steps.length-1?'End of tour':'Next step →');prev.disabled=i===0;next.disabled=i===steps.length-1;prev.onclick=()=>{active=steps[i-1].id;render()};next.onclick=()=>{active=steps[i+1].id;render()};const copy=node('button','','Copy code');copy.onclick=async()=>{try{await navigator.clipboard.writeText(s.code);copy.textContent='Copied'}catch{copy.textContent='Clipboard unavailable'}};controls.append(prev,next,copy);d.append(controls)}
render();
</script></body></html>
