[project]
name = "cetfind-public-api"
version = "0.1.0"
description = "CETFind candidate-facing public API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi[standard]==0.141.1",
  "uvicorn[standard]==0.34.0",
  "pandas==2.2.3",
  "SQLAlchemy==2.0.36",
  "psycopg2-binary==2.9.10",
]

[tool.fastapi]
entrypoint = "backend.public_main:app"
