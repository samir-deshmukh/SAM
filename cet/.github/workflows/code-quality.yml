name: Code quality

on:
  push:
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Format check for cleaned core modules
        run: >-
          ruff format --check
          backend/admin/security.py
          backend/admin/pipeline.py
          backend/admin/state.py
          backend/admin/create_admin.py
          scripts/pg_runtime.py
      - name: Lint cleaned core modules
        run: >-
          ruff check
          backend/admin/security.py
          backend/admin/pipeline.py
          backend/admin/state.py
          backend/admin/create_admin.py
          scripts/pg_runtime.py
      - name: Tests and coverage gate
        run: pytest -q
